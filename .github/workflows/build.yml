name: build
on:
  push:
  workflow_dispatch:
jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: file build/XantaMenu.dylib && otool -L build/XantaMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: XantaMenu-dylib
          path: build/XantaMenu.dylib
